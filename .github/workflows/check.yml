name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to Ubuntu 26 from 2026-10-19
        # (https://github.com/actions/runner-images/issues/14748). The pinned
        # ubuntu-24.04 leg stays on the old image, so a break after the move
        # shows up as "latest red, 24.04 green". Drop the pin once 26 is green.
        os: [ubuntu-latest, ubuntu-24.04, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # No ~/.hermes on the runner: proves the core works without Hermes.
      - name: make check
        run: make check PY=python

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Hash-locked: a changed or substituted wheel fails the install.
      - name: install ruff + mypy
        run: python -m pip install --require-hashes --no-deps -r requirements-lint.txt
      - name: make lint
        run: make lint PY=python
