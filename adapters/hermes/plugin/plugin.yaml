name: agent-inflight
version: "0.2.0"
description: "Runtime session tags for inflight.md. When a tool call hand-edits the tracker, entries it wrote with a literal `[session $VAR]` tag get the real session id the runtime knows, and new lint findings are appended to the tool result. Observe-only before the call (never blocks); fails open."
author: "scubamount"
provides_hooks:
  - pre_tool_call
  - transform_tool_result
